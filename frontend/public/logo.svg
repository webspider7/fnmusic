<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#7209b7"/>
      <stop offset="100%" stop-color="#f72585"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#0c0e17" stroke="url(#grad)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="22" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="14" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="7" fill="url(#grad)" filter="url(#glow)"/>
